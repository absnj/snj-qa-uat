name: Playwright Tests
on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Playwright project to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - merchant-admin
          - merchant-staff
          - branch-admin
          - branch-staff
          - sales-agent
          - merchant-success-staff
          - api
      module:
        description: 'Test module to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - login
          - deals
          - loyalty
          - njoybook-general
          - njoybook-staff
          - support
          - user-mgmt
          - crm-contacts
          - crm-capture-lead
          - api
  # Verifies changes to test code — including the PRs the triage agent opens.
  # Scoped to merchant-admin so a PR costs minutes, not an hour, on shared UAT.
  pull_request:
    paths:
      - 'tests/**'
      - 'playwright.config.ts'
      - 'package.json'

concurrency:
  group: playwright-uat
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 90
    runs-on: ubuntu-latest
    environment: uat
    permissions:
      contents: write
      pull-requests: write
      # The triage prompt's fallback path: when every failure is a suspected
      # regression or a flake there is no PR to open, so the agent files an
      # issue instead. Without this the report is silently lost — the token
      # answers "Resource not accessible by integration".
      issues: write
    env:
      # inputs.* are empty on pull_request — fall back to a fast, safe scope.
      PROJECT: ${{ inputs.project || 'merchant-admin' }}
      MODULE: ${{ inputs.module || 'all' }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Write .env
      run: |
        cat <<EOF > .env
        UAT_URL=${{ secrets.UAT_URL }}
        UAT_API_URL=${{ secrets.UAT_API_URL }}
        UAT_API_MERCHANT_STORE_ID=${{ secrets.UAT_API_MERCHANT_STORE_ID }}
        UAT_API_BRANCH_ID=${{ secrets.UAT_API_BRANCH_ID }}
        UAT_SUPERUSER_USER=${{ secrets.UAT_SUPERUSER_USER }}
        UAT_SUPERUSER_PASSWORD=${{ secrets.UAT_SUPERUSER_PASSWORD }}
        UAT_MERCHANT_ADMIN_USER=${{ secrets.UAT_MERCHANT_ADMIN_USER }}
        UAT_MERCHANT_ADMIN_PASSWORD=${{ secrets.UAT_MERCHANT_ADMIN_PASSWORD }}
        UAT_MERCHANT_STAFF_USER=${{ secrets.UAT_MERCHANT_STAFF_USER }}
        UAT_MERCHANT_STAFF_PASSWORD=${{ secrets.UAT_MERCHANT_STAFF_PASSWORD }}
        UAT_BRANCH_ADMIN_USER=${{ secrets.UAT_BRANCH_ADMIN_USER }}
        UAT_BRANCH_ADMIN_PASSWORD=${{ secrets.UAT_BRANCH_ADMIN_PASSWORD }}
        UAT_BRANCH_STAFF_USER=${{ secrets.UAT_BRANCH_STAFF_USER }}
        UAT_BRANCH_STAFF_PASSWORD=${{ secrets.UAT_BRANCH_STAFF_PASSWORD }}
        UAT_SALES_AGENT_USER=${{ secrets.UAT_SALES_AGENT_USER }}
        UAT_SALES_AGENT_PASSWORD=${{ secrets.UAT_SALES_AGENT_PASSWORD }}
        UAT_MERCHANT_SUCCESS_STAFF_USER=${{ secrets.UAT_MERCHANT_SUCCESS_STAFF_USER }}
        UAT_MERCHANT_SUCCESS_STAFF_PASSWORD=${{ secrets.UAT_MERCHANT_SUCCESS_STAFF_PASSWORD }}
        EOF

    # continue-on-error: a red suite is the input to triage, not the end of the
    # job. The json reporter gives the agent structured failures instead of
    # scraped stdout.
    #
    # Retries are off to keep the run short. That removes the failed-then-passed
    # signal the agent used to separate flakes from hard breaks, so it must now
    # reproduce a suspected flake itself (re-running the affected spec) rather
    # than reading it off the results.
    - name: Run Playwright tests
      id: tests
      continue-on-error: true
      env:
        PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
      run: |
        case "$MODULE" in
          all) SPEC="" ;;
          login) SPEC="tests/specs/login.spec.ts" ;;
          deals) SPEC="tests/specs/config/deals.spec.ts" ;;
          loyalty) SPEC="tests/specs/config/loyalty.spec.ts" ;;
          njoybook-general) SPEC="tests/specs/config/njoybook-general.spec.ts" ;;
          njoybook-staff) SPEC="tests/specs/config/njoybook-staff.spec.ts" ;;
          support) SPEC="tests/specs/support/support.spec.ts" ;;
          user-mgmt) SPEC="tests/specs/user-mgmt/create-user.spec.ts" ;;
          crm-contacts) SPEC="tests/specs/track/crm-contacts.spec.ts" ;;
          crm-capture-lead) SPEC="tests/specs/track/crm-capture-lead.spec.ts" ;;
          # Path prefix, not a single file — the three api specs share the `api`
          # project. Every one is currently describe.skip'd, so this reports
          # zero tests until they are unskipped.
          api) SPEC="tests/specs/api" ;;
          *) echo "Unknown module: $MODULE"; exit 1 ;;
        esac

        if [ "$PROJECT" = "all" ]; then
          npx playwright test $SPEC --reporter=html,json
        else
          npx playwright test $SPEC --project="$PROJECT" --reporter=html,json
        fi

    # Uploaded BEFORE triage, on purpose. The agent re-runs specs to verify its
    # fixes, and Playwright clears playwright-report/ at the start of every run
    # — so uploading after triage captures the agent's last scoped re-run
    # instead of this suite run. results.json and test-results/ come along
    # because the HTML report alone omits the structured results, traces,
    # screenshots and error-context files that a failure is actually debugged
    # from.
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: |
          playwright-report/
          test-results/
          results.json
        retention-days: 30

    # Not on pull_request: the agent must never triage its own PR.
    - name: Triage failures
      if: steps.tests.outcome == 'failure' && github.event_name == 'workflow_dispatch'
      uses: openai/codex-action@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        openai-api-key: ${{ secrets.OPENAI_API_KEY }}
        model: gpt-5.6-sol
        effort: high
        prompt-file: .claude/commands/triage-failures.md
        # .codex/config.toml supplies the Playwright MCP server and the `triage`
        # permission profile.
        codex-home: .codex
        # Two independent knobs, easily confused:
        #
        # safety-strategy governs the privileges of the Codex *process*.
        # drop-sudo revokes the runner user's sudo before Codex starts and is
        # what keeps OPENAI_API_KEY out of reach; it grants the sandbox nothing.
        #
        # permission-profile governs the *sandbox* — filesystem and network.
        # Omitting it falls back to the legacy workspace-write sandbox, which
        # leaves .git read-only and blocks all network, so the agent could edit
        # tests but never commit, push, or open a PR. See .codex/config.toml.
        safety-strategy: drop-sudo
        permission-profile: triage
        # Permission profiles are beta and require Codex CLI >= 0.138.0.
        # Unpinned, a rollback to an older CLI silently reverts to the legacy
        # sandbox and the agent goes quiet again.
        codex-version: 0.138.0

    - name: Remove .env
      if: always()
      run: rm -f .env

    # The suite's own verdict gates the workflow, so a red run the agent could
    # not fully fix still shows red.
    - name: Reflect suite result
      if: steps.tests.outcome == 'failure'
      run: exit 1
