# Codex config for the CI triage agent (see .github/workflows/playwright.yml).
# Supplied to the action via `codex-home: .codex`.
#
# MUST stay in sync with .mcp.json, which configures the same server for Claude
# Code during local development. The flags below are load-bearing:
# --viewport-size matches playwright.config.ts (below 1536px, action button
# labels collapse to icon-only and lose their accessible name), and
# --storage-state points at the auth state global.setup.ts produces, so the
# agent's browser is already signed in as merchant-admin.
#
# There is no GitHub MCP server: the agent runs inside this repo and uses the
# `gh` CLI (preinstalled on GitHub runners) with the workflow's GITHUB_TOKEN to
# push its branch and open the PR.

# Sandbox policy. `safety-strategy` in the workflow only drops the Codex
# process's sudo; it grants the sandbox nothing. With neither this profile nor a
# `sandbox` input, codex-action falls back to the legacy `workspace-write`
# sandbox, whose two defaults silently killed step 5 of the prompt: `.git` is
# read-only (no commit possible) and there is no network (`api.github.com`
# unreachable, so no push and no `gh pr create`). The agent triaged correctly
# and then threw the fix away every run.
#
# Do NOT add `sandbox_mode` anywhere in this file: Codex treats any legacy
# sandbox setting as opting out of permission profiles, which would restore the
# broken behaviour.
default_permissions = "triage"

# Every MCP tool call raises an approval elicitation, separately from the sandbox
# and the permission profile above. `codex exec` runs unattended with
# `approval: never`, so the default reviewer (`user`) has nobody to ask and
# auto-resolves each elicitation with `decision: Cancel`. That surfaces as
# `user cancelled MCP tool call` — a misleading string, since there is no user —
# and it killed step 2 of the prompt: the agent could never open a UAT screen,
# so it had no live accessibility snapshot to classify drift against.
#
# `auto_review` resolves elicitations without a human. It is not a sandbox
# escape: the profile above still bounds the filesystem and network.
# Valid values are `user`, `auto_review`, `guardian_subagent` (verified against
# Codex CLI 0.138.0, the version the workflow pins).
approvals_reviewer = "auto_review"

[permissions.triage]
description = "CI triage agent: edit tests, verify against UAT, open a PR"
# Extend rather than start from scratch so the baseline protections carry
# forward — notably that .codex/ stays read-only.
extends = ":workspace"

# Narrow re-grant of the one safeguard that blocks the PR. `tests/` is already
# writable under :workspace; this only adds the commit itself.
[permissions.triage.filesystem.":workspace_roots"]
".git" = "write"

# No domain allowlist. github.com and api.github.com would be easy to pin, but
# the agent also has to reach UAT to verify a fix, and that host comes from the
# UAT_URL secret — it cannot be committed to a list in this file. An allowlist
# missing the UAT host would fail step 4 exactly the way the missing network
# grant failed step 5.
[permissions.triage.network]
enabled = true

# Pinned, not `@latest`. The MCP server bundles its own playwright-core and
# launches the browser build that version expects, while CI installs browsers for
# the `playwright` version in package.json. `@latest` currently resolves to
# playwright-core 1.63, which looks for chromium-1237 / chrome-for-testing —
# a build `npx playwright install` never puts down for 1.60. Every browser_* call
# then fails with "Browser \"chrome-for-testing\" is not installed".
#
# 0.0.74 is the last release on playwright-core 1.60, matching package.json.
# Bump this and `playwright` in the same PR: package.json's caret means a future
# 1.61 resolution breaks the pairing again, silently and only inside triage.
[mcp_servers.playwright]
command = "npx"
args = [
  "-y",
  "@playwright/mcp@0.0.74",
  "--browser=chromium",
  "--headless",
  "--isolated",
  "--viewport-size=1536,900",
  "--storage-state=tests/setup/.auth/merchant_admin.json",
]
